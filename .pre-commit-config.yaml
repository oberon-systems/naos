# The commit-msg hooks below only ever run once git has a commit-msg hook
# script, which `pre-commit install` writes only when asked for that type.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        files: .*\.(yaml|yml)$
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf
      - id: remove-crlf
      - id: forbid-tabs
        files: \.(py|rs|sh|md|ya?ml|toml|hcl|html)$
      - id: remove-tabs
        args: [--whitespaces-count, '2']
        files: \.(py|rs|sh|md|ya?ml|toml|hcl|html)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - fastapi==0.141.1
          - httpx==0.28.1
          - httpx-ws==0.9.0
          - pydantic==2.13.5
          - pydantic-settings==2.15.0
          - pytest==9.1.1
          - sqlmodel==0.0.42
          - transitions==0.9.3

  - repo: https://github.com/djlint/djLint
    rev: v1.46.1
    hooks:
      # The hooks ship types_or: [jinja], a tag identify never puts on a
      # .html file, so without this override both silently match nothing.
      - id: djlint-reformat-jinja
        types_or: [html, jinja]
        files: ^packages/web/.*\.html$
      - id: djlint-jinja
        types_or: [html, jinja]
        files: ^packages/web/.*\.html$

  # hadolint is a single binary and comes from the host, like cargo and packer
  # in the local hooks below; install it once and `make lint` picks it up.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      # The three required variables are only interpolated, never used, so the
      # dummy values keep `config` from failing on an operator's empty .env.
      - id: compose-config
        name: docker compose config
        entry: env NAOS_DB_PASSWORD=x NAOS_OPERATOR_TOKEN_SHA256=x
          NAOS_RUNNER_ENROLLMENT_TOKEN_SHA256=x
          docker compose --file docker/compose.yaml config --quiet
        language: system
        files: ^docker/compose\.yaml$
        pass_filenames: false
      - id: packer-fmt
        name: packer fmt
        entry: packer fmt -recursive packer
        language: system
        files: ^packer/.*\.pkr\.hcl$
        pass_filenames: false

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: forbid-binary
      # Templates carry the separators and dashes the mockups show; vendored code stays as shipped.
      - id: require-ascii
        exclude: (.*\.md$|^packages/web/.*\.html$|^packages/web/src/naos_web/static/vendor/|^dev/web/templates/base/state\.json$)
      - id: shellcheck
        args: [-e, SC2086]
      # -i 4 overrides shfmt's tab indentation, which the forbid-tabs hook
      # above rejects in *.sh. Without it the two hooks fight over every edit.
      - id: shfmt
        args: [-w, -i, '4']

  # `cz check` validates the message against the provider's schema_pattern(),
  # so the hook environment needs the provider itself: pre-commit builds it in
  # isolation and .cz.yaml names wyld_cz. Without the extra dependency the hook
  # fails with "The committer has not been found in the system".
  #
  # The three versions move together. wyld-cz 0.2.x requires commitizen >=4.9,<5
  # and 0.2.1 is the first release implementing schema_pattern(); on 0.1.0 the
  # hook raises NotImplementedError on every commit. Keep this rev, the pin in
  # requirements.txt and the provider release in step.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        additional_dependencies: [wyld-cz==0.2.2]
      - id: commitizen-branch
        additional_dependencies: [wyld-cz==0.2.2]
        stages: [pre-push]

  - repo: meta
    hooks:
      - id: check-useless-excludes
