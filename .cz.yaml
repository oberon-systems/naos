commitizen:
  allowed_prefixes:
    - Merge
    - Revert
    - Pull request
    - fixup!
    - squash!
    - amend!
    - 'bump:'
  bump_message: 'bump: version $current_version -> $new_version'
  major_version_zero: true
  name: wyld_cz
  tag_format: $version
  update_changelog_on_bump: true
  version_provider: pep621
  version_scheme: semver
  version: 0.0.0
