[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "naos-web"
version = "0.1.0"
description = "Operator interface for naos: runs, runners, images, profiles and the audit trail"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "httpx",
  "jinja2",
  "naos-common",
  "pydantic-settings",
]

[project.urls]
Homepage = "https://github.com/oberon-systems/naos"
Repository = "https://github.com/oberon-systems/naos"

[project.optional-dependencies]
# What serves the app in a container; the library itself needs neither.
server = ["uvicorn[standard]"]

[tool.setuptools.package-data]
naos_web = ["py.typed", "templates/*.html", "templates/partials/*.html", "static/*.css", "static/vendor/*.js"]

[tool.djlint]
profile = "jinja"
# url_for() renders an absolute URL under Starlette, so the shell keeps
# root-relative paths and both url_for rules stay off. The lease bar is the one
# inline style: its width is the datum, so H021 goes with them.
ignore = "J004,J018,H021"
