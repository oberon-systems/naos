{% if run.action.post %}
    <button class="action"
            type="button"
            hx-post="{{ run.action.href }}?state={{ state }}"
            hx-target="#page"
            hx-confirm="{{ run.action.confirm }}">{{ run.action.label }}</button>
{% elif run.action.overlay %}
    <a class="action"
       href="{{ run.action.href }}"
       hx-get="{{ run.action.href }}"
       hx-target="#overlay">{{ run.action.label }}</a>
{% else %}
    <a class="action" href="{{ run.action.href }}">{{ run.action.label }}</a>
{% endif %}
