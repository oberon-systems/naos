<div class="terminal__toggles">
    <button class="terminal__chip terminal__chip--on"
            type="button"
            data-follow
            aria-pressed="true">Follow</button>
    <button class="terminal__chip"
            type="button"
            disabled
            title="the console is one serial stream">Wrap</button>
    <button class="terminal__chip"
            type="button"
            disabled
            title="the serial console carries no per-line time">Timestamps</button>
    <button class="terminal__chip"
            type="button"
            disabled
            title="the console is one serial stream">stdout + stderr</button>
</div>
