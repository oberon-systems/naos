[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "naos-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "httpx",
  "naos-common",
  "pydantic-settings",
  "sqlmodel",
]

[project.optional-dependencies]
# What serves the app in a container; the library itself needs neither.
server = ["psycopg[binary]", "uvicorn[standard]"]

[tool.setuptools.package-data]
naos_api = ["py.typed"]
