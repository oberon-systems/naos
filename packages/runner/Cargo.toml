[package]
name = "naos-runner"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Runner daemon for naos: leases Runs and boots them in disposable QEMU VMs"
license = "MIT"
repository = "https://github.com/oberon-systems/naos"
readme = "README.md"
keywords = ["agents", "sandbox", "qemu", "vm"]
categories = ["command-line-utilities", "virtualization"]
# The workspace forbids publishing; the runner is the one crate that goes to crates.io.
publish = true

[dependencies]
dotenvy = "0.15.7"
envy = "0.4.2"
nix = { version = "0.30", features = ["dir", "process", "signal", "term"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"

[dev-dependencies]
serial_test = "4.0.1"
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
