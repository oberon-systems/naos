name: naos-design

x-flags: &flags
  PENPOT_FLAGS: >-
    disable-email-verification disable-secure-session-cookies disable-onboarding
    enable-access-tokens enable-mcp
x-uri: &uri
  PENPOT_PUBLIC_URI: http://localhost:9001
x-secret-key: &secret-key
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}

volumes:
  assets:

services:
  penpot-frontend:
    image: penpotapp/frontend:2.17.2
    ports:
      - 127.0.0.1:9001:8080
    volumes:
      - assets:/opt/data/assets
      - ./autologin.conf:/etc/nginx/overrides/server.d/autologin.conf:ro
    depends_on:
      - penpot-backend
      - penpot-exporter
      - penpot-mcp
    environment:
      <<: [*flags, *uri]

  penpot-backend:
    image: penpotapp/backend:2.17.2
    volumes:
      - assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    environment:
      <<: [*flags, *uri, *secret-key]
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: penpot
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"

  penpot-mcp:
    image: penpotapp/mcp:2.17.2

  penpot-exporter:
    image: penpotapp/exporter:2.17.2
    depends_on:
      penpot-valkey:
        condition: service_healthy
    environment:
      <<: [*uri, *secret-key]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: postgres:15
    stop_signal: SIGINT
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U penpot]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    environment:
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: penpot

  penpot-valkey:
    image: valkey/valkey:8.1
    command: [valkey-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD-SHELL, valkey-cli ping | grep PONG]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
