[project]
name = "naos"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy".msg = "no SQLAlchemy imports: take the name from sqlmodel"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["naos_api", "naos_web"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/api/src:packages/web/src"
explicit_package_bases = true

# Docs use long prose lines, inline HTML and no leading H1; changelogs repeat headings per release.
[tool.pymarkdown]
plugins.md013.enabled = false
plugins.md033.enabled = false
plugins.md041.enabled = false
plugins.md024.siblings_only = true
extensions.front-matter.enabled = true

[tool.pytest.ini_options]
testpaths = ["packages", "dev/stack"]
addopts = "--import-mode=importlib"
