name: packer image

on:
  pull_request:
    paths:
      - packer/**
      - .github/workflows/packer-image.yml
  push:
    tags:
      - packer_*

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate templates
        run: make -C packer validate

  release:
    if: startsWith(github.ref, 'refs/tags/packer_')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
      - name: Build images
        run: make -C packer build-all VERSION="${GITHUB_REF_NAME#packer_}"
      - name: Checksums
        working-directory: build/agents
        run: sha256sum naos-agents-*.qcow2 > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/agents/naos-agents-*.qcow2 build/agents/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "Agents image ${GITHUB_REF_NAME#packer_}. Import its sha256 from SHA256SUMS."
