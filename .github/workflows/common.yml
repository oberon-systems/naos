name: naos-common

on:
  pull_request:
    paths:
      - packages/common/**
      - .github/workflows/common.yml
  push:
    tags:
      - naos-common-*

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install
        run: pip install ./packages/common
      - name: Import
        run: python -c 'import naos_common'

  version:
    if: startsWith(github.ref, 'refs/tags/naos-common-')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against pyproject.toml
        id: check
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/common/pyproject.toml)"
          test "$GITHUB_REF_NAME" = "naos-common-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  pypi:
    needs: version
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Build
        run: uv build --out-dir dist packages/common
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  release:
    needs: [version, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="$(awk -v head="## $GITHUB_REF_NAME " \
            'index($0, head) == 1 { keep = 1; next } /^## / { keep = 0 } keep' \
            packages/common/CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "${notes:-Naos common $VERSION on PyPI.}"
