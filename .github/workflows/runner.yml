name: runner

on:
  pull_request:
    paths:
      - packages/runner/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/runner.yml
  push:
    tags:
      - runner-*

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  version:
    if: startsWith(github.ref, 'refs/tags/runner-')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml
        id: check
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/runner/Cargo.toml)"
          test "$GITHUB_REF_NAME" = "runner-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Build
        run: cargo build --release --locked -p naos-runner
      - name: Checksums
        run: |
          mkdir dist
          cp target/release/naos-runner "dist/naos-runner-$VERSION-x86_64-linux-gnu"
          cd dist && sha256sum naos-runner-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$(awk -v head="## $GITHUB_REF_NAME " \
            'index($0, head) == 1 { keep = 1; next } /^## / { keep = 0 } keep' \
            packages/runner/CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/naos-runner-$VERSION-x86_64-linux-gnu" dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "${notes:-Runner $VERSION. Install it with packages/runner/install.sh.}"

  crates-io:
    needs: [version, release]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p naos-runner
