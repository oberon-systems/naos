name: naos-api

on:
  pull_request:
    paths:
      - packages/api/**
      - docker/api/**
      - .github/workflows/api.yml
      - requirements.txt
  push:
    tags:
      - naos-api-*

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        run: pytest -q packages/api

  version:
    if: startsWith(github.ref, 'refs/tags/naos-api-')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against pyproject.toml
        id: check
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/api/pyproject.toml)"
          test "$GITHUB_REF_NAME" = "naos-api-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  pypi:
    needs: version
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Build
        run: uv build --out-dir dist packages/api
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  image:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/naos-api:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/naos-api:latest

  release:
    needs: [version, pypi, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="$(awk -v head="## $GITHUB_REF_NAME " \
            'index($0, head) == 1 { keep = 1; next } /^## / { keep = 0 } keep' \
            packages/api/CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --latest=false \
            --notes "${notes:-Naos API $VERSION on PyPI and ghcr.io.}"
